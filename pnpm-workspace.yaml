allowBuilds:
  esbuild: true
  # @unovis（图表库）的传递依赖；postinstall 仅打印提示，无需执行
  maplibre-gl: false
  simple-git-hooks: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@iconify-json/carbon@1.2.23'
  - '@types/node@25.9.1'
shellEmulator: true
# eslint-disable-next-line pnpm/yaml-enforce-settings
trustPolicy: off
